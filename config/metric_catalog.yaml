metrics:
  margin_of_safety:
    display_name: "Margin of Safety"
    end_user_definition: |
      Compares what the business is really worth to what the market is charging, highlighting the discount (or lack of it) embedded in today's price.
    technical_definition: |
      Intrinsic value is estimated by discounting projected free cash flows plus a terminal value:
        intrinsic_value = sum_{t=1..n}(projected_fcf_t / (1 + discount_rate)^t) + terminal_value / (1 + discount_rate)^n
        terminal_value = projected_fcf_n * (1 + terminal_growth) / (discount_rate - terminal_growth)
      Margin of safety compares that intrinsic value to the current market price:
        margin_of_safety = 1 - (market_price / intrinsic_value)
      market_price is the latest close price.
    data_points:
      - price.close
      - projections.projected_fcf[]
      - assumptions.discount_rate
      - assumptions.terminal_growth
      - assumptions.projection_years

  free_cash_flow:
    display_name: "Free Cash Flow"
    end_user_definition: |
      Shows how much cash the business generates after keeping its assets in shape—cash that can pay down debt, pay dividends, or be reinvested.
    technical_definition: |
      Free cash flow equals operating cash flow minus capital expenditures:
        free_cash_flow = operating_cash_flow - capital_expenditure
    data_points:
      - financials.operating_cash_flow
      - financials.capital_expenditure

  return_on_invested_capital:
    display_name: "Return on Invested Capital (ROIC)"
    end_user_definition: |
      Measures how effectively management turns all long-term capital—debt and equity—into operating profit after tax.
    technical_definition: |
      NOPAT is operating profit after tax:
        nopat = ebit * (1 - effective_tax_rate)
        effective_tax_rate = income_tax_expense / pre_tax_income  (guard against divide-by-zero)
      Invested capital for each period:
        invested_capital_t = total_debt_t + shareholders_equity_t - cash_and_equivalents_t
      Average invested capital smooths beginning and ending balances:
        average_invested_capital = (invested_capital_begin + invested_capital_end) / 2
      Return on invested capital:
        roic = nopat / average_invested_capital
    data_points:
      - financials.ebit
      - financials.income_tax_expense
      - financials.pre_tax_income
      - financials.total_debt
      - financials.shareholders_equity
      - financials.cash_and_equivalents
      - financials_history[1].total_debt
      - financials_history[1].shareholders_equity
      - financials_history[1].cash_and_equivalents

  return_on_equity:
    display_name: "Return on Equity (ROE)"
    end_user_definition: |
      Reveals how efficiently the company turns shareholder capital into bottom-line profit.
    technical_definition: |
      Average equity smooths volatility:
        average_equity = (shareholders_equity_begin + shareholders_equity_end) / 2
      Return on equity:
        roe = net_income / average_equity
    data_points:
      - financials.net_income
      - financials.shareholders_equity
      - financials_history[1].shareholders_equity

  debt_to_equity_and_interest_coverage:
    display_name: "Debt-to-Equity & Interest Coverage"
    end_user_definition: |
      Gauges balance sheet leverage and the company's ability to cover interest payments—key signals of financial resilience.
    technical_definition: |
      Debt-to-equity compares total liabilities (or total debt) to shareholder equity:
        debt_to_equity = total_liabilities / shareholders_equity
      Interest coverage shows how many times operating profit can cover interest expense:
        interest_coverage = ebit / interest_expense
    data_points:
      - financials.total_liabilities
      - financials.shareholders_equity
      - financials.ebit
      - financials.interest_expense

  eps_growth:
    display_name: "Earnings Per Share Growth"
    end_user_definition: |
      Tracks how quickly earnings per share compound over time—a proxy for the business's growth engine.
    technical_definition: |
      Use reported EPS series when available; otherwise derive from net income and diluted shares outstanding:
        eps_t = net_income_t / diluted_shares_outstanding_t
      Use diluted shares to account for potential dilution from options, warrants, and convertibles.
      Compound annual growth rate over N years:
        eps_cagr = (eps_latest / eps_base)^(1 / years) - 1
    data_points:
      - metrics_history[].eps
      - financials_history[].net_income
      - financials_history[].shares_outstanding

  book_value_per_share_growth:
    display_name: "Book Value Per Share Growth"
    end_user_definition: |
      Indicates how effectively retained earnings are compounding tangible net worth for shareholders.
    technical_definition: |
      Book value per share:
        bvps_t = shareholders_equity_t / shares_outstanding_t
      Growth measured as compound annual growth:
        bvps_cagr = (bvps_latest / bvps_base)^(1 / years) - 1
    data_points:
      - financials_history[].shareholders_equity
      - financials_history[].shares_outstanding

  price_to_earnings:
    display_name: "Price-to-Earnings Ratio (P/E)"
    end_user_definition: |
      Shows how many dollars investors are willing to pay today for each dollar of trailing earnings.
    technical_definition: |
      Trailing P/E uses the latest closing price and trailing twelve months EPS:
        pe = market_price / ttm_eps
    data_points:
      - price.close
      - metrics.ttm_eps

  price_to_book:
    display_name: "Price-to-Book Ratio (P/B)"
    end_user_definition: |
      Compares the market price to the accounting value of equity—useful for asset-heavy businesses.
    technical_definition: |
      Price-to-book leverages book value per share:
        pb = market_price / book_value_per_share
        book_value_per_share = shareholders_equity / shares_outstanding
    data_points:
      - price.close
      - financials.shareholders_equity
      - financials.shares_outstanding

  ev_to_ebitda:
    display_name: "Enterprise Value / EBITDA"
    end_user_definition: |
      Evaluates the company's valuation independent of capital structure by comparing enterprise value to operating cash earnings.
    technical_definition: |
      Enterprise value adjusts market cap for debt and cash:
        enterprise_value = market_cap + total_debt - cash_and_equivalents
      EBITDA-based multiple:
        ev_to_ebitda = enterprise_value / ebitda
    data_points:
      - market_data.market_cap
      - financials.total_debt
      - financials.cash_and_equivalents
      - financials.ebitda

  peg_ratio:
    display_name: "PEG Ratio"
    end_user_definition: |
      Blends valuation and growth by dividing the P/E ratio by the expected earnings growth rate.
    technical_definition: |
      peg = pe / eps_growth_rate
      eps_growth_rate should be expressed as a percentage (e.g., 12 for 12%, not 0.12).
    data_points:
      - metrics.pe
      - metrics.eps_growth_rate

  operating_and_net_margin:
    display_name: "Operating Margin & Net Margin"
    end_user_definition: |
      Tests profit quality—first at the operating level and then after all expenses, taxes, and interest.
    technical_definition: |
      Operating margin isolates core operating profitability:
        operating_margin = operating_income / revenue
      Net margin captures bottom-line efficiency:
        net_margin = net_income / revenue
    data_points:
      - financials.operating_income
      - financials.net_income
      - financials.revenue

  owner_earnings:
    display_name: "Owner Earnings"
    end_user_definition: |
      Buffett's preferred cash-flow proxy—approximates the cash truly available to owners after sustaining the business.
    technical_definition: |
      Owner earnings adjust net income for non-cash charges and maintenance capital needs:
        owner_earnings = net_income + depreciation_amortization + other_non_cash_charges - capital_expenditure
      other_non_cash_charges typically includes stock-based compensation, impairments, restructuring charges, and other non-cash items.
    data_points:
      - financials.net_income
      - financials.depreciation_amortization
      - financials.other_non_cash_charges
      - financials.capital_expenditure

  return_on_retained_earnings:
    display_name: "Management Return on Retained Earnings"
    end_user_definition: |
      Evaluates how effectively management reinvests profits by comparing value created to earnings kept in the business—Buffett's "$1 test."
    technical_definition: |
      Earnings retained over the measurement period:
        earnings_retained = retained_earnings_end - retained_earnings_begin
      Value created measured by increase in book value (more conservative than market cap):
        value_created = (shareholders_equity_end - shareholders_equity_begin) - earnings_retained
      Alternative market-based approach (more volatile):
        value_created_market = (market_cap_end - market_cap_begin) + dividends_paid
      Return on retained earnings:
        return_on_retained = value_created / earnings_retained
      Note: Book value method isolates management's reinvestment effectiveness; market method includes sentiment.
    data_points:
      - financials.retained_earnings
      - financials_history[1].retained_earnings
      - financials.shareholders_equity
      - financials_history[1].shareholders_equity
      - market_data.market_cap
      - market_data_history[1].market_cap
      - cash_flow.dividends_paid

  economic_moat_score:
    display_name: "Economic Moat Indicators"
    end_user_definition: |
      Synthesizes signals such as margin stability, ROIC durability, and revenue stickiness to label the company's competitive advantage.
    technical_definition: |
      Construct a rules-based scorecard:
        margin_stability = 1 - (std_dev(gross_margin_5y) / mean(gross_margin_5y))
        roic_trend = slope(roic_history)
        revenue_cagr = (revenue_latest / revenue_base)^(1 / years) - 1
      Weighted composite maps to qualitative moat categories (e.g., wide, narrow, none) using configurable thresholds.
    data_points:
      - financials_history[].gross_margin
      - metrics_history[].roic
      - financials_history[].revenue
      - qualitative.indicators (optional)

  consistency_score:
    display_name: "Consistency of Performance"
    end_user_definition: |
      Rewards companies that deliver steady profitability and cash generation year after year.
    technical_definition: |
      Calculate normalized volatility across key metrics:
        volatility = average_normalized_std_dev([roic_history, roe_history, operating_margin_history, fcf_history])
      Convert volatility into a consistency score:
        consistency_score = 1 - volatility
      Classify score into qualitative buckets using configured cutoffs.
    data_points:
      - metrics_history[].roic
      - metrics_history[].roe
      - financials_history[].operating_margin
      - cash_flow_history[].free_cash_flow

  capital_expenditure_ratio:
    display_name: "Capital Expenditure Ratio"
    end_user_definition: |
      Shows how much of operating cash flow is being plowed back into the business—lower ratios often indicate capital efficiency.
    technical_definition: |
      capex_ratio = capital_expenditure / operating_cash_flow
      Interpret with care when operating cash flow is negative.
    data_points:
      - financials.capital_expenditure
      - financials.operating_cash_flow

  dividend_yield_and_payout_ratio:
    display_name: "Dividend Yield & Payout Ratio"
    end_user_definition: |
      Examines the cash return to shareholders and whether it is supported by earnings power.
    technical_definition: |
      Dividend yield relates dividends per share to the current price:
        dividend_yield = annual_dividend_per_share / market_price
      Payout ratio compares total dividends to net income:
        payout_ratio = dividends_paid / net_income
    data_points:
      - cash_flow.annual_dividend_per_share
      - price.close
      - cash_flow.dividends_paid
      - financials.net_income

  wacc_vs_roic_spread:
    display_name: "WACC vs ROIC Spread"
    end_user_definition: |
      Highlights whether the company is creating value by earning returns above its cost of capital.
    technical_definition: |
      spread = roic - wacc
      Positive spreads indicate value creation; negative spreads signal value destruction.
    data_points:
      - metrics.roic
      - assumptions.wacc

  ten_year_average_roce:
    display_name: "Ten-Year Average ROCE"
    end_user_definition: |
      Smooths out cycles by averaging the return on capital employed across a full decade.
    technical_definition: |
      Capital employed represents long-term capital invested in the business:
        capital_employed_t = total_assets_t - current_liabilities_t
      Alternatively: capital_employed_t = shareholders_equity_t + non_current_liabilities_t
      Annual ROCE:
        roce_t = ebit_t / capital_employed_t
      Ten-year average:
        average_roce = mean(roce_t for each year in trailing_10_years)
    data_points:
      - financials_history[].ebit
      - financials_history[].total_assets
      - financials_history[].current_liabilities

  current_ratio:
    display_name: "Current Ratio"
    end_user_definition: |
      Measures the company's ability to pay short-term obligations with short-term assets—a key liquidity indicator.
    technical_definition: |
      Current ratio compares liquid assets to near-term liabilities:
        current_ratio = current_assets / current_liabilities
      Values above 1.5 indicate good liquidity; above 2.0 is excellent.
    data_points:
      - financials.current_assets
      - financials.current_liabilities

  earnings_stability:
    display_name: "Earnings Stability"
    end_user_definition: |
      Counts the number of years with positive earnings to assess the consistency and reliability of profitability.
    technical_definition: |
      Track positive earnings years over the available history:
        positive_years = count(net_income_t > 0 for t in history)
        stability_percentage = positive_years / total_years
      For value investing, 8 out of 10 years positive is preferred.
    data_points:
      - financials.net_income
      - financials_history[].net_income

  dividend_history:
    display_name: "Dividend History Analysis"
    end_user_definition: |
      Analyzes dividend payment consistency, growth trajectory, and aristocrat status over time.
    technical_definition: |
      Track dividend payments across history:
        consecutive_years = count consecutive years with dividends > 0
        growth_years = count years where dividend_t > dividend_{t-1}
        avg_growth_rate = (dividends_latest / dividends_base)^(1 / years) - 1
      Classifications:
        - Dividend Aristocrat: 25+ consecutive years
        - Dividend Achiever: 10+ consecutive years
        - Consistent Payer: 5+ consecutive years
    data_points:
      - cash_flow.dividends_paid
      - cash_flow_history[].dividends_paid

  piotroski_fscore:
    display_name: "Piotroski F-Score"
    end_user_definition: |
      A 9-point quality test that evaluates profitability, leverage, liquidity, and operating efficiency—scores of 7+ indicate strong fundamentals.
    technical_definition: |
      Nine binary tests (1 point each if passed):
        1. Profitability: net_income > 0
        2. Operating CF: operating_cash_flow > 0
        3. ROA Improvement: current_roa > prior_roa
        4. Quality of Earnings: operating_cash_flow > net_income
        5. Decreasing Leverage: (debt/assets)_current < (debt/assets)_prior
        6. Improving Liquidity: current_ratio_current > current_ratio_prior
        7. No Dilution: shares_outstanding_current <= shares_outstanding_prior
        8. Improving Gross Margin: gross_margin_current > gross_margin_prior
        9. Improving Asset Turnover: (revenue/assets)_current > (revenue/assets)_prior
      Score: sum of all passed tests (0-9)
    data_points:
      - financials.net_income
      - financials.operating_cash_flow
      - financials.total_assets
      - financials.current_assets
      - financials.current_liabilities
      - financials.total_debt
      - financials.gross_margin
      - financials.revenue
      - market_data.shares_outstanding
      - financials_history[1].*  (all fields for year-over-year comparison)

  # ===== Buffett/Munger Additional Metrics =====

  gross_profit_margin:
    display_name: "Gross Profit Margin"
    end_user_definition: |
      Buffett's favorite moat indicator—companies with durable competitive advantages consistently earn gross margins above 40%.
    technical_definition: |
      gross_profit_margin = gross_profit / revenue
      Buffett considers >40% a sign of durable competitive advantage; <20% suggests a highly competitive industry.
    data_points:
      - financials.gross_profit
      - financials.revenue

  price_to_fcf:
    display_name: "Price to Free Cash Flow"
    end_user_definition: |
      Buffett's preferred valuation metric—how much investors pay for each dollar of free cash the business generates.
    technical_definition: |
      price_to_fcf = market_cap / free_cash_flow
      free_cash_flow = operating_cash_flow - capital_expenditure
      Values below 15 generally indicate attractive pricing.
    data_points:
      - market_data.market_cap
      - financials.operating_cash_flow
      - financials.capital_expenditure

  fcf_yield:
    display_name: "Free Cash Flow Yield"
    end_user_definition: |
      The inverse of Price-to-FCF—shows the cash return an investor earns relative to the stock price.
    technical_definition: |
      fcf_yield = free_cash_flow / market_cap
      free_cash_flow = operating_cash_flow - capital_expenditure
      Yields above 5% are generally considered attractive.
    data_points:
      - market_data.market_cap
      - financials.operating_cash_flow
      - financials.capital_expenditure

  long_term_debt_to_earnings:
    display_name: "Long-term Debt to Earnings"
    end_user_definition: |
      How many years of earnings it would take to pay off all debt—Buffett prefers companies that could be debt-free in under 4 years.
    technical_definition: |
      long_term_debt_to_earnings = total_debt / net_income
      Values below 4 indicate manageable debt levels.
    data_points:
      - financials.total_debt
      - financials.net_income

  quality_of_earnings:
    display_name: "Quality of Earnings"
    end_user_definition: |
      Compares cash generated from operations to reported earnings—values above 1.0 mean the company generates more cash than it reports in profit.
    technical_definition: |
      quality_of_earnings = operating_cash_flow / net_income
      Values above 1.0 indicate high-quality, cash-backed earnings.
      Values well below 1.0 may signal aggressive accounting.
    data_points:
      - financials.operating_cash_flow
      - financials.net_income

  altman_z_score:
    display_name: "Altman Z-Score"
    end_user_definition: |
      A bankruptcy risk predictor combining five financial ratios—scores above 3.0 indicate financial safety.
    technical_definition: |
      z_score = 1.2*X1 + 1.4*X2 + 3.3*X3 + 0.6*X4 + 1.0*X5
      X1 = working_capital / total_assets
      X2 = retained_earnings / total_assets
      X3 = ebit / total_assets
      X4 = market_cap / total_liabilities
      X5 = revenue / total_assets
      Score > 3.0: Safe zone; 1.8-3.0: Grey zone; < 1.8: Distress zone.
    data_points:
      - financials.current_assets
      - financials.current_liabilities
      - financials.total_assets
      - financials.total_liabilities
      - financials.retained_earnings
      - financials.ebit
      - financials.revenue
      - market_data.market_cap

  cash_conversion_cycle:
    display_name: "Cash Conversion Cycle"
    end_user_definition: |
      How many days it takes to convert inventory investments into cash—shorter cycles indicate more efficient operations.
    technical_definition: |
      ccc = DSO + DIO - DPO
      DSO = (accounts_receivable / revenue) * 365
      DIO = (inventory / cost_of_goods_sold) * 365
      DPO = (accounts_payable / cost_of_goods_sold) * 365
    data_points:
      - financials.revenue
      - financials.accounts_receivable
      - financials.inventory
      - financials.accounts_payable
      - financials.gross_profit

  graham_number:
    display_name: "Graham Number"
    end_user_definition: |
      Benjamin Graham's intrinsic value formula—if the stock price is below the Graham Number, the stock may be undervalued.
    technical_definition: |
      graham_number = sqrt(22.5 * EPS * BVPS)
      EPS = net_income / shares_outstanding
      BVPS = shareholders_equity / shares_outstanding
      margin_of_safety = (graham_number - price) / graham_number
    data_points:
      - financials.net_income
      - financials.shareholders_equity
      - market_data.shares_outstanding
      - price.close

  cash_return_on_invested_capital:
    display_name: "Cash Return on Invested Capital (CROIC)"
    end_user_definition: |
      Measures how efficiently a company converts invested capital into free cash flow—a cash-based alternative to ROIC.
    technical_definition: |
      croic = free_cash_flow / invested_capital
      free_cash_flow = operating_cash_flow - capital_expenditure
      invested_capital = total_debt + shareholders_equity - cash_and_equivalents
      Values above 15% indicate excellent cash generation.
    data_points:
      - financials.operating_cash_flow
      - financials.capital_expenditure
      - financials.total_debt
      - financials.shareholders_equity
      - financials.cash_and_equivalents

  gross_margin_stability:
    display_name: "Gross Margin Stability"
    end_user_definition: |
      Measures how consistent gross margins have been over time—low volatility signals a durable competitive moat.
    technical_definition: |
      Collect gross margins from financials_history.
      coefficient_of_variation = std_dev(gross_margins) / mean(gross_margins)
      stability = 1 - coefficient_of_variation
      Values above 0.85 indicate high stability.
    data_points:
      - financials_history[].gross_margin

  debt_to_ebitda:
    display_name: "Debt to EBITDA"
    end_user_definition: |
      How many years of operating earnings it would take to pay off all debt—a key leverage metric used by Buffett.
    technical_definition: |
      debt_to_ebitda = total_debt / ebitda
      Values below 3.0x are considered conservative.
    data_points:
      - financials.total_debt
      - financials.ebitda

  net_debt_to_equity:
    display_name: "Net Debt to Equity"
    end_user_definition: |
      Adjusts leverage for cash on hand—shows how much net debt exists relative to shareholder equity.
    technical_definition: |
      net_debt_to_equity = (total_debt - cash_and_equivalents) / shareholders_equity
      Negative values mean the company has more cash than debt.
    data_points:
      - financials.total_debt
      - financials.cash_and_equivalents
      - financials.shareholders_equity

  accruals_ratio:
    display_name: "Accruals Ratio"
    end_user_definition: |
      Detects earnings manipulation—high accruals relative to assets may signal aggressive accounting.
    technical_definition: |
      accruals_ratio = (net_income - operating_cash_flow) / total_assets
      Values closer to zero or negative indicate higher earnings quality.
    data_points:
      - financials.net_income
      - financials.operating_cash_flow
      - financials.total_assets

  asset_turnover:
    display_name: "Asset Turnover"
    end_user_definition: |
      How efficiently a company uses its assets to generate revenue—higher values indicate better asset utilization.
    technical_definition: |
      asset_turnover = revenue / total_assets
    data_points:
      - financials.revenue
      - financials.total_assets

  sustainable_growth_rate:
    display_name: "Sustainable Growth Rate"
    end_user_definition: |
      The maximum growth rate achievable without external financing—based on ROE and earnings retention.
    technical_definition: |
      retention_ratio = 1 - (dividends_paid / net_income)
      roe = net_income / shareholders_equity
      sustainable_growth_rate = roe * retention_ratio
    data_points:
      - financials.net_income
      - financials.shareholders_equity
      - cash_flow.dividends_paid

  capex_to_depreciation:
    display_name: "CapEx to Depreciation"
    end_user_definition: |
      Compares new investment to asset wear-and-tear—ratios near 1.0 mean the company is just maintaining assets.
    technical_definition: |
      capex_to_depreciation = capital_expenditure / depreciation_amortization
      Values above 1.5 suggest significant growth investment.
      Values below 1.0 may indicate underinvestment.
    data_points:
      - financials.capital_expenditure
      - financials.depreciation_amortization

  sloan_ratio:
    display_name: "Sloan Ratio"
    end_user_definition: |
      An earnings quality metric—lower ratios indicate earnings are backed by real cash flows rather than accounting accruals.
    technical_definition: |
      sloan_ratio = (net_income - (operating_cash_flow - capital_expenditure)) / total_assets
      Values below -10% indicate high quality; above 10% may signal manipulation.
    data_points:
      - financials.net_income
      - financials.operating_cash_flow
      - financials.capital_expenditure
      - financials.total_assets

  rd_to_revenue:
    display_name: "R&D to Revenue"
    end_user_definition: |
      How much revenue is reinvested in research—Buffett prefers companies that don't need heavy R&D to maintain their moat.
    technical_definition: |
      rd_to_revenue = research_and_development / revenue
      Data sourced from SEC EDGAR XBRL filings.
    data_points:
      - financials.research_and_development
      - financials.revenue

  sga_to_gross_profit:
    display_name: "SG&A to Gross Profit"
    end_user_definition: |
      Munger's efficiency metric—companies with durable advantages keep SG&A below 80% of gross profit.
    technical_definition: |
      sga_to_gross_profit = selling_general_admin / gross_profit
      Values below 80% indicate efficient operations.
      Data may be sourced from SEC EDGAR XBRL filings.
    data_points:
      - financials.selling_general_admin
      - financials.gross_profit

  goodwill_to_assets:
    display_name: "Goodwill to Assets"
    end_user_definition: |
      How much of the balance sheet is goodwill from acquisitions—high ratios may indicate overpaying for acquisitions.
    technical_definition: |
      goodwill_to_assets = goodwill / total_assets
      Values above 30% warrant scrutiny of acquisition history.
      Data sourced from SEC EDGAR XBRL filings.
    data_points:
      - financials.goodwill
      - financials.total_assets

  return_on_tangible_equity:
    display_name: "Return on Tangible Equity (ROTE)"
    end_user_definition: |
      ROE without the distortion of goodwill and intangibles—shows the true return on hard assets.
    technical_definition: |
      tangible_equity = shareholders_equity - goodwill - intangible_assets
      rote = net_income / tangible_equity
      Values above 15% indicate excellent returns on real assets.
    data_points:
      - financials.net_income
      - financials.shareholders_equity
      - financials.goodwill
      - financials.intangible_assets
