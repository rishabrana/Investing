# Data Source Mapping Configuration
# Priority: polygon.io (1st) -> alpha_vantage (2nd) -> yahoo_finance (3rd)

data_sources:
  # Price Data - Polygon.io
  price.close:
    primary: polygon.io
    endpoint: /v2/aggs/ticker/{ticker}/range/1/day/{from}/{to}
    field: close

  price.open:
    primary: polygon.io
    endpoint: /v2/aggs/ticker/{ticker}/range/1/day/{from}/{to}
    field: open

  price.high:
    primary: polygon.io
    endpoint: /v2/aggs/ticker/{ticker}/range/1/day/{from}/{to}
    field: high

  price.low:
    primary: polygon.io
    endpoint: /v2/aggs/ticker/{ticker}/range/1/day/{from}/{to}
    field: low

  # Market Data - Polygon.io
  market_data.market_cap:
    primary: polygon.io
    endpoint: /v3/reference/tickers/{ticker}
    field: market_cap

  market_data.shares_outstanding:
    primary: polygon.io
    endpoint: /v3/reference/tickers/{ticker}
    field: weighted_shares_outstanding
    alternative_field: share_class_shares_outstanding

  market_data_history[].market_cap:
    primary: polygon.io
    note: Historical market cap from ticker overview endpoint with date parameter

  # Balance Sheet - Polygon.io Primary
  financials.shareholders_equity:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: equity

  financials.total_liabilities:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: liabilities

  financials.cash_and_equivalents:
    primary: polygon.io
    secondary: yahoo_finance
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: cash

  financials.total_debt:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: long_term_debt
    note: May need to add current portion of debt

  financials.total_assets:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: assets

  financials.current_assets:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: current_assets

  financials.current_liabilities:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: current_liabilities

  financials.accounts_receivable:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: accounts_receivable

  financials.inventory:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: inventory

  financials.accounts_payable:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: accounts_payable

  # Balance Sheet - Alpha Vantage Fallback
  financials.retained_earnings:
    primary: alpha_vantage
    secondary: yahoo_finance
    endpoint: BALANCE_SHEET
    field: retainedEarnings
    note: Not available in Polygon.io, use Alpha Vantage

  # Income Statement - Polygon.io Primary
  financials.revenue:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: income_statement
    field: revenues

  financials.net_income:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: income_statement
    field: net_income_loss

  financials.operating_income:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: income_statement
    field: operating_income
    note: May need calculation from gross_profit - operating_expenses

  financials.gross_profit:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: income_statement
    field: gross_profit

  financials.operating_expenses:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: income_statement
    field: operating_expenses

  financials.cost_of_revenue:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: income_statement
    field: cost_of_revenue

  financials.income_tax_expense:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: income_statement
    field: income_tax_expense_benefit

  metrics.ttm_eps:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: income_statement
    field: basic_earnings_per_share
    alternative_field: diluted_earnings_per_share

  # Income Statement - Alpha Vantage Fallback
  financials.interest_expense:
    primary: alpha_vantage
    secondary: yahoo_finance
    endpoint: INCOME_STATEMENT
    field: interestExpense
    note: Not directly available in Polygon.io

  financials.pre_tax_income:
    primary: polygon.io
    calculation: net_income + income_tax_expense
    fallback: alpha_vantage
    fallback_field: incomeBeforeTax

  financials.ebit:
    primary: polygon.io
    calculation: operating_income OR net_income + interest_expense + income_tax_expense
    fallback: alpha_vantage
    fallback_field: ebit

  financials.ebitda:
    primary: alpha_vantage
    secondary: yahoo_finance
    calculation: ebit + depreciation_amortization
    field: ebitda
    note: Calculate from EBIT + D&A

  financials.depreciation_amortization:
    primary: alpha_vantage
    secondary: yahoo_finance
    endpoint: INCOME_STATEMENT
    field: depreciationAndAmortization
    note: May also be in cash flow statement

  financials.gross_margin:
    primary: polygon.io
    calculation: gross_profit / revenue

  financials.operating_margin:
    primary: polygon.io
    calculation: operating_income / revenue

  # Cash Flow Statement - Polygon.io Primary
  financials.operating_cash_flow:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: cash_flow
    field: net_cash_flow_from_operating_activities

  financials.capital_expenditure:
    primary: polygon.io
    secondary: yahoo_finance
    endpoint: /vX/reference/financials
    statement: cash_flow
    field: derived_from_investing_activities
    note: Extract from net_cash_flow_from_investing_activities

  cash_flow.dividends_paid:
    primary: polygon.io
    secondary: yahoo_finance
    endpoint: /vX/reference/financials
    statement: cash_flow
    field: derived_from_financing_activities
    note: Extract from net_cash_flow_from_financing_activities

  cash_flow.net_cash_flow:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: cash_flow
    field: net_cash_flow

  cash_flow.annual_dividend_per_share:
    primary: alpha_vantage
    secondary: yahoo_finance
    calculation: dividends_paid / shares_outstanding
    note: Calculate from total dividends and shares outstanding

  # Cash Flow - Alpha Vantage Fallback
  financials.other_non_cash_charges:
    primary: alpha_vantage
    secondary: yahoo_finance
    endpoint: CASH_FLOW
    note: Stock-based compensation, impairments, etc. from cash flow details

  # Historical Data
  financials_history[].net_income:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: income_statement
    field: net_income_loss
    note: Use limit parameter for historical data

  financials_history[].shareholders_equity:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: equity

  financials_history[].shares_outstanding:
    primary: polygon.io
    endpoint: /v3/reference/tickers/{ticker}
    field: weighted_shares_outstanding
    note: Historical snapshots

  financials_history[].total_debt:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: long_term_debt

  financials_history[].cash_and_equivalents:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: cash

  financials_history[].revenue:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: income_statement
    field: revenues

  financials_history[].ebit:
    primary: polygon.io
    calculation: operating_income
    fallback: alpha_vantage

  financials_history[].total_assets:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: assets

  financials_history[].current_liabilities:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: balance_sheet
    field: current_liabilities

  financials_history[].gross_margin:
    primary: polygon.io
    calculation: gross_profit / revenue

  financials_history[].operating_margin:
    primary: polygon.io
    calculation: operating_income / revenue

  metrics_history[].eps:
    primary: polygon.io
    endpoint: /vX/reference/financials
    statement: income_statement
    field: diluted_earnings_per_share

  metrics_history[].roic:
    primary: polygon.io
    calculation: nopat / average_invested_capital
    note: Calculate from available fields

  metrics_history[].roe:
    primary: polygon.io
    calculation: net_income / average_equity

  cash_flow_history[].free_cash_flow:
    primary: polygon.io
    calculation: operating_cash_flow - capital_expenditure

  # Assumptions & Projections
  projections.projected_fcf[]:
    primary: financial_modeling_prep
    secondary: finnhub
    tertiary: user_input
    endpoint_fmp: /analyst-estimates/{ticker}
    endpoint_finnhub: /stock/eps-estimate
    note: Use analyst estimates for revenue/earnings, derive FCF projections, or user provides custom projections
    calculation: projected_revenue * estimated_fcf_margin (from historical avg)

  assumptions.discount_rate:
    primary: calculated
    calculation: wacc OR user-defined required return
    note: Use WACC as discount rate, or user can override with custom rate

  assumptions.terminal_growth:
    primary: user_input
    secondary: gdp_growth_proxy
    default: 2.5%
    note: Typically 2-3% (long-term GDP growth rate), user can override

  assumptions.projection_years:
    primary: user_input
    default: 10
    note: Typically 5-10 years, user-defined

  assumptions.wacc:
    primary: calculated
    calculation: (equity_value / total_value) * cost_of_equity + (debt_value / total_value) * cost_of_debt * (1 - tax_rate)
    note: Calculate from cost of equity and cost of debt
    components:
      - assumptions.cost_of_equity
      - assumptions.cost_of_debt
      - financials.total_debt
      - financials.shareholders_equity
      - financials.effective_tax_rate

  # WACC Components - API Sourced!
  assumptions.cost_of_equity:
    primary: calculated
    calculation: risk_free_rate + beta * market_risk_premium
    note: CAPM formula (Capital Asset Pricing Model)
    components:
      - assumptions.risk_free_rate
      - assumptions.beta
      - assumptions.market_risk_premium

  assumptions.cost_of_debt:
    primary: calculated
    calculation: interest_expense / total_debt
    fallback: default_industry_rate
    note: Calculate from financials or use industry average

  assumptions.beta:
    primary: financial_modeling_prep
    secondary: yahoo_finance
    tertiary: alpha_vantage
    endpoint_fmp: /profile/{ticker}
    field_fmp: beta
    field_yf: ticker.info['beta']
    note: Stock beta (5-year monthly vs S&P500)

  assumptions.risk_free_rate:
    primary: alpha_vantage
    secondary: financial_modeling_prep
    tertiary: fred_api
    endpoint_av: TREASURY_YIELD&maturity=10year
    field: value
    default: 4.0%
    note: 10-Year Treasury Yield, use latest value

  assumptions.market_risk_premium:
    primary: financial_modeling_prep
    secondary: user_input
    endpoint_fmp: /market-risk-premium
    default: 6.0%
    note: Historical equity risk premium (typically 5-7%)

  # Qualitative Data - Manual Input
  qualitative.indicators:
    primary: user_input
    note: Qualitative assessment of competitive advantages

# API Configuration
api_priority:
  - polygon.io              # Primary - price data, most financials
  - financial_modeling_prep # Secondary - missing fields, beta, estimates, WACC components
  - alpha_vantage           # Tertiary - treasury yields, backup financials
  - finnhub                 # Quaternary - analyst estimates
  - yahoo_finance           # Last resort - fallback for development/testing

api_endpoints:
  polygon.io:
    base_url: https://api.polygon.io
    auth: api_key
    rate_limit: 5 calls/minute (free tier)
    coverage: price data, market data, financial statements (10+ years)

  financial_modeling_prep:
    base_url: https://financialmodelingprep.com/api/v3
    auth: api_key
    rate_limit: 250 requests/day (free tier)
    coverage: all financials, beta, analyst estimates, market risk premium, WACC components
    key_endpoints:
      - /profile/{ticker} - Company profile with beta
      - /income-statement/{ticker} - Income statement (includes interest, depreciation, EBITDA)
      - /balance-sheet-statement/{ticker} - Balance sheet (includes retained earnings)
      - /cash-flow-statement/{ticker} - Cash flow statement
      - /analyst-estimates/{ticker} - Analyst earnings/revenue estimates
      - /market-risk-premium - Market risk premium data

  alpha_vantage:
    base_url: https://www.alphavantage.co/query
    auth: api_key
    rate_limit: 5 calls/minute, 500 calls/day (free tier)
    coverage: financials backup, treasury yields (risk-free rate)
    key_endpoints:
      - INCOME_STATEMENT - Income statement
      - BALANCE_SHEET - Balance sheet
      - CASH_FLOW - Cash flow statement
      - TREASURY_YIELD - US Treasury yields (3mo, 2yr, 5yr, 7yr, 10yr, 30yr)

  finnhub:
    base_url: https://finnhub.io/api/v1
    auth: api_key
    rate_limit: 60 calls/minute (free tier - most generous!)
    coverage: analyst estimates, basic financials
    key_endpoints:
      - /stock/estimate - EPS estimates
      - /stock/revenue-estimate - Revenue estimates
      - /stock/metric - Basic fundamentals (117 metrics)

  yahoo_finance:
    library: yfinance
    auth: none
    rate_limit: reasonable use
    note: Unofficial API, use for development only
    coverage: all data, but unreliable

# Field Mapping Notes
mapping_notes:
  polygon_to_standard:
    equity: shareholders_equity
    liabilities: total_liabilities
    revenues: revenue
    net_income_loss: net_income
    income_tax_expense_benefit: income_tax_expense
    net_cash_flow_from_operating_activities: operating_cash_flow

  alpha_vantage_to_standard:
    retainedEarnings: retained_earnings
    interestExpense: interest_expense
    depreciationAndAmortization: depreciation_amortization
    incomeBeforeTax: pre_tax_income

  yahoo_finance_to_standard:
    "Interest Expense": interest_expense
    "Depreciation": depreciation_amortization
    "Retained Earnings": retained_earnings
    "Operating Income": operating_income
